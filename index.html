<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autosales Pro - Calculadora & Inspeção</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        
        /* Estilos do Login */
        #login-screen { text-align: center; padding-top: 50px; }
        #login-screen input { width: 100%; max-width: 300px; padding: 12px; margin: 10px 0; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; text-align: center; }
        #login-screen button { background-color: #003355; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; max-width: 325px; }
        #error-msg { color: #ef4444; margin-top: 10px; display: none; font-size: 14px; }

        /* Estilos da Calculadora */
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; color: #475569; }
        input[type="number"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
        button.calc-btn { background-color: #10B981; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 800; width: 100%; cursor: pointer; margin-top: 10px; }
        
        /* Resultados */
        .result-box { margin-top: 20px; padding: 20px; background-color: #003355; color: white; border-radius: 8px; text-align: center; }
        .result-box h2 { margin: 0; font-size: 16px; font-weight: 400; color: #94a3b8; }
        .result-box .valor-final { font-size: 32px; font-weight: 900; color: #10B981; margin: 10px 0; }
        .result-box .walk-away { font-size: 18px; color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="login-screen">
        <h2>Acesso Restrito</h2>
        <p style="color: #64748b; font-size: 14px; margin-bottom: 20px;">Insira a sua palavra-passe da Kiwify para aceder à ferramenta.</p>
        <input type="password" id="pass-input" placeholder="Palavra-passe de acesso">
        <br>
        <button onclick="verificarSenha()">Entrar no Autosales Pro</button>
        <div id="error-msg">Palavra-passe incorreta. Verifique o seu acesso na Kiwify.</div>
    </div>

    <!-- APLICAÇÃO PRINCIPAL -->
    <div id="app-content" class="container" style="display: none;">
        
        <!-- 1. NOVA LOGO AUTOSALES PRO -->
        <div style="display: flex; justify-content: center; margin-bottom: 20px;">
            <img src="logo.png" alt="Autosales Pro Logo" style="width: 100%; max-width: 350px; height: auto;">
        </div>

        <!-- 2. BOTÃO DO NOTION -->
        <div style="text-align: center; margin-bottom: 25px; margin-top: 5px;">
            <a href="https://melodious-throat-e21.notion.site/To-inspect-3eccfceb1116807ba509f88d4c139d8d" target="_blank" style="background-color: #003355; color: white; padding: 12px 24px; text-decoration: none; border-radius: 8px; font-family: inherit; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>
                </svg>
                Abrir Checklist de Inspeção
            </a>
        </div>

        <!-- 3. CALCULADORA -->
        <div class="form-group">
            <label>Valor da Tabela FIPE (R$)</label>
            <input type="number" id="fipe" placeholder="Ex: 50000">
        </div>
        <div class="form-group">
            <label>Reparos Mecânicos Estimados (R$)</label>
            <input type="number" id="mecanica" placeholder="Ex: 1500">
        </div>
        <div class="form-group">
            <label>Estética e Documentação (R$)</label>
            <input type="number" id="estetica" placeholder="Ex: 800">
        </div>
        <div class="form-group">
            <label>Margem de Lucro Desejada (R$)</label>
            <input type="number" id="lucro" placeholder="Ex: 5000">
        </div>
        
        <button class="calc-btn" onclick="calcularLucro()">CALCULAR LIMITE DE COMPRA</button>

        <div class="result-box" id="resultado-box" style="display: none;">
            <h2>OFERTA MÁXIMA RECOMENDADA</h2>
            <div class="valor-final" id="mao-result">R$ 0,00</div>
            <div class="walk-away">LIMITE ABSOLUTO: <span id="walk-away-result">R$ 0,00</span></div>
            <p style="font-size: 12px; color: #94a3b8; margin-top: 15px; margin-bottom: 0;">*Acima deste limite, o seu lucro entra na zona de risco.</p>
        </div>
    </div>

    <script>
        // Sistema de Proteção por Senha
        function verificarSenha() {
            var senha = document.getElementById("pass-input").value;
            if (senha === "KIWIFY2026") {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("app-content").style.display = "block";
            } else {
                document.getElementById("error-msg").style.display = "block";
            }
        }

        // Lógica de Cálculo da Ferramenta
        function calcularLucro() {
            var fipe = parseFloat(document.getElementById('fipe').value) || 0;
            var mecanica = parseFloat(document.getElementById('mecanica').value) || 0;
            var estetica = parseFloat(document.getElementById('estetica').value) || 0;
            var lucro = parseFloat(document.getElementById('lucro').value) || 0;

            var valorVendaEstimado = fipe * 0.90; 
            var mao = valorVendaEstimado - mecanica - estetica - lucro;
            var walkAway = valorVendaEstimado - mecanica - estetica - (lucro * 0.5);

            document.getElementById('mao-result').innerText = mao.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            document.getElementById('walk-away-result').innerText = walkAway.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            document.getElementById('resultado-box').style.display = 'block';
        }
    </script>
</body>
</html>
